<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>site-blocker</title>
  </head>
  <body>
    <main>
      <header class="header">
        <h1>ブロックするサイト</h1>
        <div class="sun" aria-hidden="true"></div>
      </header>
      <form id="add" class="add">
        <label for="site-input" class="visually-hidden">追加するサイト</label>
        <div class="add-row">
          <input
            id="site-input"
            class="field"
            type="text"
            placeholder="ブロックするサイト"
            autocomplete="off"
          />
          <button type="submit" class="btn-primary">追加</button>
        </div>
        <p id="message" class="message" role="status"></p>
      </form>
      <section class="sites">
        <p id="count" class="overline" hidden></p>
        <ul id="sites"></ul>
        <div id="empty" class="empty" hidden>
          <p class="empty-title">まだ何も登録されていません</p>
          <p class="empty-body">
            つい開いてしまうサイトを登録すると、<br />その時間だけ静かな画面に切り替わります。
          </p>
        </div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
