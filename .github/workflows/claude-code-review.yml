name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            ${{ github.repository }} のプルリク #${{ github.event.pull_request.number }} をレビューする。コメントは日本語で書く。

            ## 最初に読むもの
            - `.claude/rules/rule-review.md` — 指摘の形式。**すべての指摘はこの形式に従う**
            - `CLAUDE.md` と `.claude/rules/` の他のファイル — このリポジトリの前提
            - `gh pr view ${{ github.event.pull_request.number }}` — 本文。「関連spec」に書かれた `docs/specs/<機能名>/` があれば読む
            - `gh pr diff ${{ github.event.pull_request.number }}` — 差分

            ## 見る観点
            `rule-review.md` の観点に加えて、このリポジトリでは次を重く見る。
            - spec（requirements / design / tasks）から逸脱していないか。tasks.md の `_範囲:_` の外を触っていないか
            - 本文の「動作確認」が、実際に走らせた結果になっているか。「通るはず」で済ませていないか
            - URL の契約（`guide-tech.md` の「URL の契約」）と、拡張と Web を疎結合に保つ前提を壊していないか
            - 契約や前提を変えたのに、ドキュメントが古いまま残っていないか

            ## 指摘の出し方
            - 行に紐づく指摘は `mcp__github_inline_comment__create_inline_comment` でインラインに書く
            - 各コメントは必ず `<修正要否> (<観点>): ` で始める。例: `MUST (Functionality): ...`
            - `rule-review.md` の「書き方」に従う。特に、好みを `MUST` / `SHOULD` にしない、lint で直せるものは指摘しない
            - 最後に `gh pr comment` で総括を1件だけ投稿する。修正要否ごとの件数の表と、`MUST` が1件以上あるかを書く。指摘がなければ「指摘なし」と1行で書く
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

